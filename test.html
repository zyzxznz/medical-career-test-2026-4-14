<!DOCTYPE html>
<html>
<head>
    <title>测试按钮</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 50px; text-align: center; }
        button { 
            padding: 20px 40px; 
            font-size: 18px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        #result { margin-top: 20px; font-size: 16px; color: #333; }
    </style>
</head>
<body>
    <h1>医护职业转型测试系统</h1>
    <button id="test-btn" onclick="testClick()">开始测试</button>
    <div id="result"></div>

    <script>
        let clickCount = 0;
        function testClick() {
            clickCount++;
            document.getElementById('result').innerHTML = 
                `点击成功！计数: ${clickCount}<br>时间: ${new Date().toLocaleTimeString()}`;
            console.log('按钮点击成功');
        }
    </script>
</body>
</html>
